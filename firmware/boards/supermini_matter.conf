# -----------------------------------------------------------------------------
# Flash Layout & Adafruit/nice!nano UF2 Bootloader Offset
# -----------------------------------------------------------------------------
CONFIG_PARTITION_MANAGER_ENABLED=n
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_FLASH_LOAD_OFFSET=0x26000
CONFIG_FLASH_LOAD_SIZE=0xc6000

# -----------------------------------------------------------------------------
# Disable MCUboot & DFU (Standalone Image for Adafruit UF2 Bootloader)
# -----------------------------------------------------------------------------
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_SECURE_BOOT=n
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_DFU_OVER_BT_SMP=n

# -----------------------------------------------------------------------------
# Disable Factory Data Generation (Use Kconfig Credentials Directly)
# -----------------------------------------------------------------------------
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n

# -----------------------------------------------------------------------------
# Clock Management (Crucial for SuperMini clones without 32kHz crystal)
# -----------------------------------------------------------------------------
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# -----------------------------------------------------------------------------
# Matter Commissioning & Credentials (Matching Google Home Manual Code 3497-011-2332)
# -----------------------------------------------------------------------------
CONFIG_CHIP=y
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_DEVICE_VENDOR_ID=65521
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_CHIP_DEVICE_DISCRIMINATOR=3840
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021
CONFIG_CHIP_COMMISSIONABLE_DEVICE_TYPE=y
CONFIG_CHIP_ENABLE_DNSSD_SRP=y

# -----------------------------------------------------------------------------
# USB CDC ACM Virtual Serial Console & OpenThread Diagnostics
# -----------------------------------------------------------------------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="SuperMini Matter Thread Health Checker"
CONFIG_USB_DEVICE_MANUFACTURER="Antigravity"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y

# OpenThread Shell for mesh queries
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_PING_SENDER=y
CONFIG_OPENTHREAD_DIAG=y
