# -----------------------------------------------------------------------------
# System & C++ Runtime
# -----------------------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y

# -----------------------------------------------------------------------------
# Clock Management (Crucial for SuperMini nRF52840 clones)
# Use internal 32.768 kHz RC oscillator to avoid hangs if external crystal is missing
# -----------------------------------------------------------------------------
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# -----------------------------------------------------------------------------
# USB CDC ACM Serial Console
# -----------------------------------------------------------------------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="SuperMini Thread Health Checker"
CONFIG_USB_DEVICE_MANUFACTURER="Antigravity"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y

# -----------------------------------------------------------------------------
# OpenThread Network Stack (Full Thread Device / Router-capable)
# -----------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_FTD=y
CONFIG_OPENTHREAD_MANUAL_START=n
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_PING_SENDER=y
CONFIG_OPENTHREAD_DIAG=y
CONFIG_NET_IPV6=y

# -----------------------------------------------------------------------------
# Bluetooth LE (Required for Matter BLE Commissioning)
# -----------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SuperMini-Thread"
CONFIG_BT_SMP=y
CONFIG_BT_TINYCRYPT_ECC=y

# -----------------------------------------------------------------------------
# Matter (Project CHIP) Stack
# -----------------------------------------------------------------------------
CONFIG_CHIP=y
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_DEVICE_VENDOR_ID=65521
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_CHIP_DEVICE_TYPE=256
CONFIG_CHIP_DEVICE_DISCRIMINATOR=3840
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021
CONFIG_CHIP_COMMISSIONABLE_DEVICE_TYPE=y
CONFIG_CHIP_ENABLE_DNSSD_SRP=y

# -----------------------------------------------------------------------------
# Non-Volatile Storage (Thread Credentials & Fabric Storage)
# -----------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
