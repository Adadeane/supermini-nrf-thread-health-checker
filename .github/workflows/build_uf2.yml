name: Build SuperMini nRF52840 Thread Health Checker UF2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-openthread:
    name: Build OpenThread Health Checker (Fast)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Zephyr Project and Toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      - name: Compile OpenThread Firmware
        run: |
          west build -b nrf52840dongle/nrf52840 -d build_ot app/firmware -- \
            -DEXTRA_DTC_OVERLAY_FILE=$GITHUB_WORKSPACE/app/firmware/boards/supermini_nrf52840.overlay \
            -DCONF_FILE=prj_openthread_only.conf

      - name: Convert to UF2
        run: |
          python3 app/tools/uf2conv.py -c -b 0x26000 -f 0xada52840 \
            build_ot/zephyr/zephyr.hex \
            -o supermini_openthread_cli.uf2
          python3 app/tools/uf2conv.py -c -b 0x26000 -f 0x239a00b3 \
            build_ot/zephyr/zephyr.hex \
            -o supermini_openthread_cli_nicenano.uf2

      - name: Upload OpenThread UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supermini-openthread-uf2
          path: |
            supermini_openthread_*.uf2
            build_ot/zephyr/zephyr.hex

  build-matter:
    name: Build Matter On/Off Light & Health Checker
    runs-on: ubuntu-latest
    container:
      image: nordicplayground/nrfconnect-sdk:v2.7-branch
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Locate Matter Sample & Compile Firmware
        shell: bash
        run: |
          echo "=== Installing System Dependencies ==="
          apt-get update && apt-get install -y libyaml-0-2 || true

          echo "=== Setting up Toolchain Environment ==="
          TC_DIR=$(find /root/ncs/toolchains -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -n 1)
          if [ -n "$TC_DIR" ]; then
            echo "Found Toolchain at: $TC_DIR"
            export PATH="$TC_DIR/usr/local/bin:$TC_DIR/usr/bin:$PATH"
            for lib_dir in $(find "$TC_DIR" -type d \( -name "lib" -o -name "lib64" \) 2>/dev/null); do
              export LD_LIBRARY_PATH="$lib_dir:$LD_LIBRARY_PATH"
            done

            SDK_DIR=$(find "$TC_DIR" -name "zephyr-sdk*" -type d 2>/dev/null | head -n 1)
            if [ -n "$SDK_DIR" ]; then
              echo "Found Zephyr SDK at: $SDK_DIR"
              export ZEPHYR_SDK_INSTALL_DIR="$SDK_DIR"
            fi
          fi
          
          if [ -f /workdir/zephyr/zephyr-env.sh ]; then
            source /workdir/zephyr/zephyr-env.sh || true
          fi

          echo "West binary: $(which west || echo 'NOT FOUND')"
          west --version

          echo "=== Searching for Matter Samples in NCS ==="
          SAMPLE_PATH=$(find / -type d -path "*/samples/matter/light_bulb" 2>/dev/null | head -n 1)
          if [ -z "$SAMPLE_PATH" ]; then
            echo "light_bulb sample not found, looking for template..."
            SAMPLE_PATH=$(find / -type d -path "*/samples/matter/template" 2>/dev/null | head -n 1)
          fi
          echo "Selected Matter Sample Path: $SAMPLE_PATH"

          if [ -z "$SAMPLE_PATH" ]; then
            echo "ERROR: Could not locate Matter sample directory!"
            exit 1
          fi

          # Detect board target name
          BOARD="nrf52840dongle/nrf52840"
          if ! west boards 2>/dev/null | grep -q "nrf52840dongle/nrf52840"; then
            BOARD="nrf52840dongle_nrf52840"
          fi
          echo "Selected board target: $BOARD"

          # Determine base config file
          CONF="prj_no_dfu.conf"
          if [ ! -f "$SAMPLE_PATH/prj_no_dfu.conf" ]; then
            CONF="prj.conf"
          fi
          echo "Selected base conf: $CONF"

          # Build Matter firmware as a single image without MCUboot sysbuild
          west build --no-sysbuild -p always -b "$BOARD" -d build_matter "$SAMPLE_PATH" -- \
            -DEXTRA_DTC_OVERLAY_FILE="$GITHUB_WORKSPACE/app/firmware/boards/supermini_nrf52840.overlay" \
            -DCONF_FILE="$CONF" \
            -DEXTRA_CONF_FILE="$GITHUB_WORKSPACE/app/firmware/boards/supermini_matter.conf"

      - name: Convert to UF2
        shell: bash
        run: |
          TC_DIR=$(find /root/ncs/toolchains -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -n 1)
          if [ -n "$TC_DIR" ]; then
            export PATH="$TC_DIR/usr/local/bin:$TC_DIR/usr/bin:$PATH"
            export LD_LIBRARY_PATH="$TC_DIR/usr/local/lib:$TC_DIR/usr/lib:$TC_DIR/lib:$LD_LIBRARY_PATH"
          fi
          python3 app/tools/uf2conv.py -c -b 0x26000 -f 0xada52840 \
            build_matter/zephyr/zephyr.hex \
            -o supermini_matter_health_checker.uf2
          python3 app/tools/uf2conv.py -c -b 0x26000 -f 0x239a00b3 \
            build_matter/zephyr/zephyr.hex \
            -o supermini_matter_health_checker_nicenano.uf2

      - name: Upload Matter UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supermini-matter-uf2
          path: |
            supermini_matter_*.uf2
            build_matter/zephyr/zephyr.hex
